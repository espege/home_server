- name: Ansible | Copy remote directory if directory exists with name {{ docker_app }}
  when:
    - directory_to_copy is defined
    - directory_to_copy.stat.exists
    - not volume_structure_copied is truthy
  block:
    - name: Debug directory name
      ansible.builtin.debug:
        msg: "Directory found for {{ docker_app }} at {{ directory_to_copy.stat.path }}. Copying to {{ remote_directory }}"
        verbosity: 1

    - name: Create temp directory for j2 processing
      ansible.builtin.tempfile:
        path: "/tmp/"
        state: directory
        suffix: _j2tmp
      become: false
      register: temp_j2_dir
      changed_when: false

    - name: Synchronize | Docker App Directory Structure to remote temp dir {{ temp_j2_dir.path }}
      ansible.posix.synchronize:
        src: "{{ directory_to_copy.stat.path }}"
        dest: "{{ temp_j2_dir.path }}/"
        mode: push
        delete: false
        rsync_opts:
          - "--exclude=*.venv*/"
          - "--exclude=venv/"
      become: false

    - name: Ansible | Find | .j2 files in remote temp directory
      ansible.builtin.find:
        paths: "{{ temp_j2_dir.path }}"
        patterns: "*.j2"
        file_type: file
        recurse: true
      register: temp_j2_files

    - name: Ansible | Convert .j2 files in remote temp dir. Total = {{ temp_j2_files.files | length }}
      ansible.builtin.template:
        src: "{{ item.path | regex_replace('^' ~ ((temp_j2_dir.path ~ '/' ~ (directory_to_copy.stat.path | basename) ~ '/') | regex_escape), directory_to_copy.stat.path ~ '/') }}"
        dest: "{{ item.path | regex_replace('\\.j2$', '') }}"
        mode: "0770"
      loop: "{{ temp_j2_files.files }}"
      loop_control:
        label: "{{ item.path | regex_replace('\\.j2$', '') | basename }}"
      when: temp_j2_files is defined and temp_j2_files.files | length > 0
      changed_when: false

    - name: Copy processed directory to final destination {{ remote_directory }}
      ansible.builtin.copy:
        src: "{{ temp_j2_dir.path }}/"
        dest: "{{ remote_directory }}"
        mode: "preserve"
        owner: "{{ bind_volume_owner }}"
        group: "{{ bind_volume_group }}"
        remote_src: true

  rescue:
    - name: Fail the task | Rescue Block
      ansible.builtin.fail:
        msg: "Failed to copy and process directory structure for {{ docker_app }}"

  always:
    - name: Remove temp directory | Always Block
      become: false
      ansible.builtin.file:
        path: "{{ temp_j2_dir.path }}"
        state: absent
      when: temp_j2_dir is defined and temp_j2_dir.path is defined
      register: temp_dir_cleanup
      changed_when: false

    - name: Ansible | Set Fact | volume_structure_copied completed
      ansible.builtin.set_fact:
        volume_structure_copied: "{{ (temp_dir_cleanup is not skipped) | ternary(true, false) }}"
