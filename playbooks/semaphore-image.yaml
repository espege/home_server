
- name: Docker Image Creation
  hosts: homelab
  become: true

  vars_files:
    - vars/sensitive/docker-sensitive.yaml

  tasks:
    - name: Create & Publish Docker Image
      ansible.builtin.include_role:
        name: docker-build
      vars:
        docker_build_name: "semaphore-custom"
        docker_build_path: "/home/{{ ansible_user }}/images"
        docker_build_dockerfile : "{{ playbook_dir }}/../files/dockerfiles/semaphore/Dockerfile"
        docker_build_args:
          BUILD_AUTHOR: "{{ semaphore.runner_1.build_author | default('ansible') }}"
