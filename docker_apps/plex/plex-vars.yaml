---
state: present
local_compose_output: true  # Output to local machine
connect_to_traefik: true
linux_users:
  - name: plex
    comment: 'Plex Media Server service account | Created by ansible'
    shell: /usr/sbin/nologin
bind_volume_owner: plex
bind_volume_group: "Media"
linux_extra_groups:
  - Media
backup_volumes:
  - "{{ docker_compose_generator_default_bind_path }}/plex/config"
